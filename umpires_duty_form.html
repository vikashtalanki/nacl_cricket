        // ── Lightweight client-side cache to stay under the cricclubs API call limit ──
        // (daily 500 / weekly 5000 / monthly 15000, shared across all NACL forms). Near-static
        // reads (series list/details, teams, team players) are cached in localStorage; completed
        // scorecards never change so they're cached permanently. Live reads (schedule) are never
        // cached. An in-flight map also collapses duplicate concurrent requests for the same URL.
        var CC_TTL = 6 * 60 * 60 * 1000; // 6 hours
        var _ccInflight = {};
        function ccTtl(url) {
            if (/getSeriesList|getSeriesDetails|getTeamsList|getTeamPlayers/.test(url)) return CC_TTL;
            return 0; // schedule, matches, scorecards (unless caller forces), submissions -> live
        }
        // ccGetJSON(url, cb, cacheForever): drop-in for $.getJSON(url, cb). Returns the same
        // jqXHR/promise so .done()/.fail() chaining still works. Pass cacheForever=true to cache
        // a response permanently regardless of URL (used for scorecards of completed matches,
        // which never change).
        function ccGetJSON(url, cb, cacheForever) {
            cb = cb || function () {};
            var ttl = cacheForever === true ? -1 : ccTtl(url);
            var key = 'cc:' + url;
            if (ttl !== 0) {
                try {
                    var hit = JSON.parse(localStorage.getItem(key));
                    if (hit && (ttl < 0 || (Date.now() - hit.t) < ttl)) {
                        cb(hit.d);
                        return $.Deferred().resolve(hit.d).promise();
                    }
                } catch (e) {}
            }
            if (!_ccInflight[url]) {
                _ccInflight[url] = $.getJSON(url).done(function (data) {
                    if (ttl !== 0) {
                        try { localStorage.setItem(key, JSON.stringify({ t: Date.now(), d: data })); } catch (e) {}
                    }
                }).always(function () { delete _ccInflight[url]; });
            }
            return _ccInflight[url].done(cb);
        }

        function submitPhoneNumbers(umpire1phone,umpire2phone) {
            if (umpire1phone.trim() == '') {
                alert('Enter Umpire1 phone number');
            }
            if (umpire2phone.trim() == '') {
                alert('Enter Umpire2 phone number');
            }
        }

        function getFormattedDate(date) {
            let year = date.getFullYear();
            let month = (1 + date.getMonth()).toString().padStart(2, '0');
            let day = date.getDate().toString().padStart(2, '0');
          
            return month + '/' + day + '/' + year;
        }

        function getDayOfWeek(date) {
          const dayOfWeek = new Date(date).getDay();    
          return isNaN(dayOfWeek) ? null : 
            ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][dayOfWeek];
        }

        function getDateString(date) {
            var date = new Date(date);
            return date.toDateString();
        }
    </script>
